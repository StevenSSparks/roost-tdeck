[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; enable OPI PSRAM
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDEV_SECRETS
lib_deps =
  bblanchon/ArduinoJson@^7
  lvgl/lvgl@^8.4
  bodmer/TJpg_Decoder@^1.1
  jgromes/RadioLib@^6
  mikalhart/TinyGPSPlus@^1.0
extra_scripts = pre:scripts/gen_secrets.py

[env:smoke]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDEV_SECRETS
build_src_filter = -<*> +<smoke/>
lib_deps =
  bblanchon/ArduinoJson@^7
  mikalhart/TinyGPSPlus@^1.0
extra_scripts = pre:scripts/gen_secrets.py

[env:app]
platform = espressif32@6.5.0   ; Arduino-ESP32 2.0.14 — TFT_eSPI 2.5 needs core 2.x (3.x crashes in init)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = -<*> +<app/>
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDEV_SECRETS
  ; --- TFT_eSPI config for T-Deck Plus ST7789 (no User_Setup.h needed) ---
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=38
  -DTFT_MOSI=41
  -DTFT_SCLK=40
  -DTFT_CS=12
  -DTFT_DC=11
  -DTFT_RST=-1
  -DTFT_BL=42
  -DTFT_BACKLIGHT_ON=1
  -DTFT_INVERSION_ON=1
  -DLOAD_GLCD=1
  -DLOAD_GFXFF=1
  -DSPI_FREQUENCY=40000000
lib_deps =
  bblanchon/ArduinoJson@^7
  bodmer/TFT_eSPI@^2.5
  bodmer/TJpg_Decoder@^1.1
  mikalhart/TinyGPSPlus@^1.0
  ewpa/LibSSH-ESP32@^5
extra_scripts = pre:scripts/gen_secrets.py

[env:native]
platform = native
test_framework = unity
build_flags = -DNATIVE_TEST -std=gnu++17
extra_scripts = pre:build_native.py
lib_deps =
  bblanchon/ArduinoJson@^7
